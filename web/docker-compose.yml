services:
  postgres:
    image: postgres:17-alpine
    container_name: propfirm-adventure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propfirm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propfirm_secret}
      POSTGRES_DB: ${POSTGRES_DB:-propfirm_adventure}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propfirm} -d ${POSTGRES_DB:-propfirm_adventure}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
